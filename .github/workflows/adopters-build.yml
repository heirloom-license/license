name: Build adopters directory
on:
  push:
    branches: [main]
    paths: [adopters.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - run: python scripts/build_adopters.py
      - name: Commit regenerated directory
        run: |
          git config user.name heirloom-bot
          git config user.email bot@heirloomlicense.org
          git add ADOPTERS.md site/adopters.json
          git diff --cached --quiet || git commit -m "chore: rebuild adopters directory"
          git push
      - name: Purge jsDelivr cache so the site sees new data
        run: curl -sS "https://purge.jsdelivr.net/gh/heirloom-license/license@main/site/adopters.json" || true
