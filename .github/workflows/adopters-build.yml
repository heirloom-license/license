name: Build adopters directory
on:
  push:
    branches: [main]
    paths: [adopters.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild directory and purge cache
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" repo
          cd repo
          python3 -m pip install pyyaml --break-system-packages -q || python3 -m pip install pyyaml -q
          python3 scripts/build_adopters.py
          git config user.name heirloom-bot
          git config user.email bot@heirloomlicense.org
          git add ADOPTERS.md site/adopters.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild adopters directory"
            git push origin HEAD:main
          fi
          curl -sS "https://purge.jsdelivr.net/gh/heirloom-license/license@main/site/adopters.json" || true
