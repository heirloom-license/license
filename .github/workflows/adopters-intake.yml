name: Adopter intake
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  intake:
    if: contains(join(github.event.issue.labels.*.name, ','), 'adopter-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Verify badge and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" repo
          cd repo
          python3 -m pip install pyyaml --break-system-packages -q || python3 -m pip install pyyaml -q
          python3 scripts/adopter_intake.py
